[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratkat"
version = "0.5.0"
description = "A Scratch-like Python library for creating simple interactive projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "qtpy>=2.4.0",
    "PySide6>=6.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scratkat*"]
